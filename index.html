<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Ventas - Polyplas</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0f14;
      --surface:  #161920;
      --card:     #1e222d;
      --border:   #2a2f3d;
      --accent:   #00e5a0;
      --danger:   #ff4d6d;
      --text:     #f0f2f8;
      --muted:    #6b7280;
      --input-bg: #252a38;
      --radius:   14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0,229,160,0.07) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -200px; right: -200px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,184,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .logo-text span {
      color: var(--accent);
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,229,160,0.12);
      border: 1px solid rgba(0,229,160,0.25);
      border-radius: 99px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.4)} }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
    }
    h1 em { font-style: normal; color: var(--accent); }
    .subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    /* Grupos */
    .group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s;
      outline: none;
      appearance: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.12);
    }
    input::placeholder { color: var(--muted); }
    select option { background: var(--card); }

    /* Monto con prefijo $ */
    .input-prefix {
      position: relative;
    }
    .input-prefix::before {
      content: '$';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }
    .input-prefix input {
      padding-left: 28px;
    }

    /* Canales */
    .canales {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .canal-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      user-select: none;
    }
    .canal-btn input[type="radio"] { display: none; }
    .canal-btn .icon { font-size: 18px; }
    .canal-btn:has(input:checked) {
      border-color: var(--accent);
      background: rgba(0,229,160,0.08);
      color: var(--text);
    }

    /* Botón */
    .btn-wrap { margin-top: 24px; }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #00c47a);
      border: none;
      border-radius: 12px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: #0d0f14;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      letter-spacing: .02em;
    }
    button[type="submit"]:hover { opacity: .9; transform: translateY(-1px); }
    button[type="submit"]:active { transform: translateY(0); }
    button[type="submit"]:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
      opacity: 0;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--accent); color: var(--accent); }
    .toast.error   { border-color: var(--danger); color: var(--danger); }

    /* Pantalla de éxito */
    .success-screen {
      display: none;
      text-align: center;
      padding: 40px 24px;
    }
    .success-screen.visible { display: block; }
    .success-icon {
      width: 70px; height: 70px;
      background: rgba(0,229,160,0.12);
      border: 2px solid var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 30px;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes popIn { from{transform:scale(0)} to{transform:scale(1)} }
    .success-screen h2 { font-family:'Syne',sans-serif; font-size:22px; font-weight:800; margin-bottom:8px; }
    .success-screen p  { color:var(--muted); font-size:14px; line-height:1.6; }
    .btn-nueva {
      margin-top: 24px;
      display: inline-block;
      padding: 11px 28px;
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 99px;
      color: var(--accent);
      font-family: 'Syne',sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-nueva:hover { background: rgba(0,229,160,0.1); }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(13,15,20,0.3);
      border-top-color: #0d0f14;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- Logo Polyplas -->
  <div class="logo-wrap">
    <div class="logo-text">poly<span>plas</span></div>
  </div>

  <!-- Título -->
  <div class="header">
    <div class="badge"><span></span> Bodega</div>
    <h1>Registro de <em>Ventas</em></h1>
    <p class="subtitle">Completa los datos cada vez que cierres una venta.</p>
  </div>

  <div class="card">

    <!-- Formulario -->
    <div id="formContent">

      <div class="group">
        <label>Fecha de la venta</label>
        <input type="date" id="fecha" required />
      </div>

      <div class="group">
        <label>Nombre del producto</label>
        <input type="text" id="producto" placeholder="Ej: Lamina acrilica 3mm" required />
      </div>

      <div class="group">
        <label>Monto de la venta</label>
        <div class="input-prefix">
          <input type="text" id="monto" placeholder="0" inputmode="numeric" required />
        </div>
      </div>

      <div class="group">
        <label>Canal de venta</label>
        <div class="canales">
          <label class="canal-btn">
            <input type="radio" name="canal" value="Instagram" />
            <span class="icon">📸</span> Instagram
          </label>
          <label class="canal-btn">
            <input type="radio" name="canal" value="WhatsApp" />
            <span class="icon">💬</span> WhatsApp
          </label>
          <label class="canal-btn">
            <input type="radio" name="canal" value="Facebook" />
            <span class="icon">👍</span> Facebook
          </label>
          <label class="canal-btn">
            <input type="radio" name="canal" value="Mercado Libre" />
            <span class="icon">🛒</span> Mercado Libre
          </label>
        </div>
      </div>

      <div class="btn-wrap">
        <button type="submit" id="btnEnviar" onclick="enviarVenta()">
          Registrar venta →
        </button>
      </div>
    </div>

    <!-- Pantalla de éxito -->
    <div class="success-screen" id="successScreen">
      <div class="success-icon">✓</div>
      <h2>¡Venta registrada!</h2>
      <p>Los datos fueron guardados correctamente<br>en la planilla de control.</p>
      <button class="btn-nueva" onclick="resetForm()">+ Registrar otra venta</button>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUO_wpwWrLlNXUmkCiXed8FNN0xuegbX_PywaJ-qy8lQP8D6ttThze3Q0FE9xsRmUm7g/exec";

  // Fecha de hoy por defecto
  document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

  // Formato de miles automático en el campo monto
  document.getElementById('monto').addEventListener('input', function () {
    const raw = this.value.replace(/\./g, '').replace(/\D/g, '');
    this.value = raw ? parseInt(raw).toLocaleString('es-CL') : '';
  });

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  async function enviarVenta() {
    const fecha    = document.getElementById('fecha').value;
    const producto = document.getElementById('producto').value.trim();
    const monto    = parseInt(document.getElementById('monto').value.replace(/\./g, '')) || 0;
    const canalEl  = document.querySelector('input[name="canal"]:checked');

    if (!fecha || !producto || !monto) {
      showToast('Completa todos los campos obligatorios', 'error');
      return;
    }
    if (!canalEl) {
      showToast('Selecciona el canal de venta', 'error');
      return;
    }

    const canal = canalEl.value;
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Guardando...';

    const url = SCRIPT_URL + '?' + new URLSearchParams({ fecha, producto, monto, canal });

    try {
      await fetch(url, {
        method: 'GET',
        mode: 'no-cors'
      });
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('successScreen').classList.add('visible');
    } catch (err) {
      showToast('Error al conectar. Intenta de nuevo.', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Registrar venta →';
    }
  }

  function resetForm() {
    document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
    document.getElementById('producto').value = '';
    document.getElementById('monto').value = '';
    document.querySelectorAll('input[name="canal"]').forEach(r => r.checked = false);
    document.getElementById('successScreen').classList.remove('visible');
    document.getElementById('formContent').style.display = 'block';
    document.getElementById('btnEnviar').disabled = false;
    document.getElementById('btnEnviar').innerHTML = 'Registrar venta →';
  }
</script>
</body>
</html>
